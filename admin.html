<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة الشحن</title>
<style>
:root{--g:#052b14;--lime:#b6ff3b;--ink:#f4fff0;--line:rgba(255,255,255,.2);color-scheme:dark}
*{box-sizing:border-box;margin:0;font-family:system-ui,'Cairo',sans-serif}
[hidden]{display:none!important}
body{background:var(--g);color:var(--ink);padding:14px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{color:var(--lime);text-align:center}
.c{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
input{font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink)}
button{font-size:16px;font-weight:700;padding:10px;border:0;border-radius:10px;background:var(--lime);color:#06210f}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:right}tr.u{cursor:pointer}
.ok{color:var(--lime)}.bad{color:#ff7a7a}.w{overflow-x:auto}
</style></head><body>
<h1>💳 لوحة الشحن</h1>
<div class="c" id="lg"><input id="k" type="password" placeholder="مفتاح الأدمن" autocomplete="off"><button id="in">دخول</button><div id="lm" class="bad"></div></div>
<div class="c" id="tp" hidden><input id="i" placeholder="ID اللاعب (P-12345)" style="direction:ltr;text-transform:uppercase"><input id="a" type="number" inputmode="numeric" placeholder="عدد النقاط (سالب للخصم)"><input id="n" placeholder="ملاحظة (اختياري)"><button id="go">شحن</button><div id="m"></div></div>
<div class="c w" id="us" hidden><b>اللاعبين (اضغط على صف لتعبئة الـ ID)</b><table id="ut"></table></div>
<div class="c w" id="tx" hidden><b>آخر العمليات</b><table id="xt"></table></div>
<script>
var K=sessionStorage.getItem('ak')||'',$=function(s){return document.querySelector(s)};
var ER={nouser:'الـ ID مش موجود',amount:'عدد النقاط غلط',neg:'الرصيد مش هيكفي للخصم',auth:'المفتاح غلط'};
function H(){return{'Content-Type':'application/json','x-admin-key':K}}
function row(t,a,h){var r=document.createElement('tr');a.forEach(function(x){var c=document.createElement(h?'th':'td');c.textContent=x;r.appendChild(c)});t.appendChild(r);return r}
function box(on){['#tp','#us','#tx'].forEach(function(s){$(s).hidden=!on});$('#lg').hidden=on}
function load(){fetch('/api/admin/data',{headers:H()}).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){sessionStorage.removeItem('ak');box(false);$('#lm').textContent='المفتاح غلط';return}
  box(true);var ut=$('#ut'),xt=$('#xt');ut.innerHTML='';xt.innerHTML='';
  row(ut,['ID','الاسم','الرصيد'],1);
  d.users.forEach(function(u){var r=row(ut,[u.id,u.name,u.points]);r.className='u';r.onclick=function(){$('#i').value=u.id;$('#a').focus()}});
  row(xt,['الوقت','ID','±','السبب','الرصيد'],1);
  d.tx.forEach(function(t){row(xt,[new Date(t.t).toLocaleString('ar-EG'),t.id,t.a,t.w,t.b])});
}).catch(function(){$('#lm').textContent='تعذر الاتصال'})}
$('#in').onclick=function(){K=$('#k').value.trim();sessionStorage.setItem('ak',K);load()};
$('#go').onclick=function(){var id=$('#i').value.trim().toUpperCase(),a=+$('#a').value,m=$('#m');
  if(!id||!a){m.className='bad';m.textContent='اكتب الـ ID وعدد النقاط';return}
  if(!confirm('شحن '+a+' نقطة للـ '+id+' ؟'))return;
  fetch('/api/admin/topup',{method:'POST',headers:H(),body:JSON.stringify({id:id,amount:a,note:$('#n').value})}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){m.className='ok';m.textContent='✅ تم — رصيد '+d.id+' بقى '+d.points;$('#a').value='';$('#n').value='';load()}
    else{m.className='bad';m.textContent=ER[d.err]||'حصل خطأ'}
  }).catch(function(){m.className='bad';m.textContent='تعذر الاتصال'})};
if(K)load();
</script></body></html>
